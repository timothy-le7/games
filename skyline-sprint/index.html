<script>
(()=>{
'use strict';
const text=new TextEncoder();
const decode=new TextDecoder();
const payload=JSON.parse(document.getElementById('games-access-gate-payload').textContent);
const form=document.getElementById('games-access-gate-form');
const input=document.getElementById('games-access-gate-password');
const button=form.querySelector('button');
const status=document.getElementById('games-access-gate-status');
const storageKey='games-access-gate:'+payload.v+':'+payload.k;
const handoffKey=storageKey+':handoff';
let unlockInFlight=false;
const b64=value=>{
  const raw=atob(value),out=new Uint8Array(raw.length);
  for(let index=0;index<raw.length;index++)out[index]=raw.charCodeAt(index);
  return out;
};
const toB64=value=>{
  let raw='';
  for(const byte of value)raw+=String.fromCharCode(byte);
  return btoa(raw);
};
const message=(value,error=false)=>{
  status.textContent=value;
  status.dataset.error=error?'true':'';
};
const setBusy=value=>{
  button.disabled=value;
  form.setAttribute('aria-busy',value?'true':'false');
};
const importKey=bytes=>crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['decrypt']);
async function derive(password){
  const material=await crypto.subtle.importKey('raw',text.encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(payload.s),iterations:payload.i,hash:'SHA-256'},material,256);
  const bytes=new Uint8Array(bits);
  return {key:await importKey(bytes),session:toB64(bytes)};
}
async function replaceDocument(source){
  const parsed=new DOMParser().parseFromString(source,'text/html');
  document.replaceChild(document.importNode(parsed.documentElement,true),document.documentElement);
  for(const script of [...document.querySelectorAll('script')]){
    const type=(script.getAttribute('type')||'').trim().toLowerCase();
    if(type&&!['text/javascript','application/javascript','module'].includes(type))continue;
    const replacement=document.createElement('script');
    for(const attribute of script.attributes)replacement.setAttribute(attribute.name,attribute.value);
    if(script.src){
      replacement.async=false;
      const loaded=new Promise((resolve,reject)=>{
        replacement.addEventListener('load',resolve,{once:true});
        replacement.addEventListener('error',()=>reject(new Error('A protected page script could not load.')),{once:true});
      });
      script.replaceWith(replacement);
      await loaded;
    }else{
      replacement.textContent=script.textContent;
      script.replaceWith(replacement);
    }
  }
}
async function decrypt(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.n),additionalData:text.encode('games-access-gate:'+payload.v+':'+payload.k)},key,b64(payload.c));
  return decode.decode(plain);
}
async function unlock(key){
  await replaceDocument(await decrypt(key));
  return true;
}
function stored(){
  try{
    const value=sessionStorage.getItem(storageKey);
    return value&&/^[A-Za-z0-9+/]{43}=$/.test(value)?value:null;
  }catch{return null}
}
function remember(value){
  try{sessionStorage.setItem(storageKey,value);return sessionStorage.getItem(storageKey)===value}catch{return false}
}
function handoffReady(){try{return sessionStorage.getItem(handoffKey)==='ready'}catch{return false}}
function armHandoff(){try{sessionStorage.setItem(handoffKey,'ready');return sessionStorage.getItem(handoffKey)==='ready'}catch{return false}}
function consumeHandoff(){try{sessionStorage.removeItem(handoffKey)}catch{}}
function isReloadNavigation(){
  try{
    const entry=performance.getEntriesByType('navigation')[0];
    return entry?.type==='reload'||performance.navigation?.type===1;
  }catch{return false}
}
function forget(){
  try{sessionStorage.removeItem(storageKey);sessionStorage.removeItem(handoffKey)}catch{}
}
async function tryStored(){
  if(!globalThis.crypto?.subtle)return;
  const value=stored();
  if(!value)return;
  // Rehydrating a stored gate immediately after a library-to-game navigation
  // can race the first scoped worker in WebKit. A marker lets this fresh
  // document take one ordinary reload first; the following document consumes
  // it and decrypts normally. The marker is session-only and has no secret.
  if(!handoffReady()&&!isReloadNavigation()&&armHandoff()){
    location.reload();
    return;
  }
  consumeHandoff();
  // This script runs while a freshly fetched gate is still parsing. Let that
  // document finish first. The lock document deliberately never inspects or
  // starts a scoped worker: doing so here would put WebKit's worker lifecycle
  // back in the document-replacement window. The decrypted runtime owns its
  // normal scoped registration after this replacement has completed.
  if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
  unlockInFlight=true;
  setBusy(true);
  message('Unlocking…');
  try{
    await unlock(await importKey(b64(value)));
  }catch{
    unlockInFlight=false;
    forget();
    setBusy(false);
    message('Enter the password to continue.');
    input.focus();
  }
}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(unlockInFlight)return;
  if(!globalThis.crypto?.subtle){
    message('This browser cannot unlock this page.',true);
    return;
  }
  const password=input.value;
  if(!password){
    message('Enter the password to continue.',true);
    input.focus();
    return;
  }
  unlockInFlight=true;
  setBusy(true);
  message('Unlocking…');
  try{
    const result=await derive(password);
    const source=await decrypt(result.key);
    input.value='';
    // A real same-origin reload creates the first decrypted document in the
    // browser's normal lifecycle. WebKit otherwise loses this session entry
    // if a library page was rehydrated in place and a scoped game worker is
    // activated during the next immediate reload. Storage-refusal contexts
    // retain the direct, non-persistent unlock path below.
    if(remember(result.session)&&armHandoff()){
      location.reload();
      return;
    }
    await replaceDocument(source);
  }catch{
    unlockInFlight=false;
    input.value='';
    forget();
    message('The password did not unlock this page.',true);
    input.focus();
  }finally{
    if(!unlockInFlight)setBusy(false);
  }
});
input.focus();
tryStored();
})();
