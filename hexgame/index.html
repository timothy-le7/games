 openModal(`${modalCloseButton()}<span class="eyebrow">EXPLORATION IS EVERYTHING</span><h2>Your first few turns</h2><p class="subtitle">Build your tribe into a tiny, mighty civilization.</p><div class="help-list"><div class="help-step"><span class="help-number">1</span><div><b>Explore the square.</b><br>Tap your warrior, then a blue tile to move. Drag the map and pinch or scroll to zoom. Start a turn on ancient ruins, then tap Examine to find treasure, technology, population, an Explorer, or a veteran unit.</div></div><div class="help-step"><span class="help-number">2</span><div><b>Grow your cities.</b><br>Harvest fruit, animals, and fish inside your borders. Climbing reveals gold ore on some mountains; Mining lets you build mines there for 5 stars and 2 population. Mountains without ore cannot be mined.</div></div><div class="help-step"><span class="help-number">3</span><div><b>Spend your stars wisely.</b><br>Research in Technology to unlock buildings and units. Ports cost 7 stars and turn arriving land units into Rafts. Upgrade a Raft in your territory into a Scout, Rammer or Bomber.</div></div><div class="help-step"><span class="help-number">4</span><div><b>Settle. Battle. Conquer.</b><br>Stand on a village or enemy city. On your next turn, tap Capture. Tap red targets to attack. An idle damaged unit can recover.</div></div><div class="help-step"><span class="help-number">5</span><div><b>Make every turn count.</b><br>Discover four Lighthouses for capital population. Track free Monument rewards in Game Stats. Markets beside production buildings raise your income. End turn refreshes units and collects stars. In Domination, capture every enemy city. In Perfection, build your highest score in 30 turns.</div></div></div><button class="large-button" id="help-done">Let's explore ${icon('chevron')}</button>`,'How to play');$('help-done').onclick=()=>closeModal();
}
function openTraining(c){
 if(busy||game.over||isAnimating()||upgradeQueue.length||!game.cities.includes(c)||c.owner!==0)return;
 const p=cityProgress(c),blocked=trainingStatus(c),choices=trainableUnits(c),unaffordable=unlockedUnits().length-choices.length;
 openModal(`${modalCloseButton()}<span class="eyebrow">${c.name.toUpperCase()} · LEVEL ${c.level}</span><h2>Train a unit</h2>${cityProgressHTML(c)}<p class="subtitle">${blocked||'Choose a unit · Ready next turn.'}</p><div class="unit-grid">${choices.map(k=>{const d=TYPES[k];return `<button class="unit-card" data-train="${k}" aria-label="Train ${d.name} for ${d.cost} stars"><div class="portrait">${portrait(faction(0).tribe,k)}</div><span class="price">${d.cost}${icon('star')}</span><strong>${d.name}</strong><small>${d.hp} HP · ${d.convert?'Convert':d.freeze&&!d.attack?'Freeze':d.attack+' attack'}</small></button>`}).join('')}</div><p class="save-label">${faction(0).stars} stars available${!blocked&&unaffordable?' · Save more stars for stronger units.':''}<br>Research in the Tech Tree to unlock more units.</p>`,'Train a unit');$('modal').classList.add('unit-chooser');document.querySelectorAll('[data-train]').forEach(el=>el.onclick=()=>train(c,el.dataset.train));
}
function showNextUpgrade(){
 if(!upgradeQueue.length){closeModal(true);return}const reward=upgradeQueue[0],c=game.cities.find(c=>c.id===reward.id);if(!c||c.owner!==0){upgradeQueue.shift();showNextUpgrade();return}const level=reward.level;
 const superDef=TYPES[superUnit(0)],rewards=level===2?[{key:'workshop',name:'Workshop',icon:'city',desc:'+1 star every turn'},{key:'explorer',name:'Explorer',icon:'eye',desc:'An Explorer travels 12 steps toward unexplored lands'}]:level===3?[{key:'resources',name:'Resources',icon:'star',desc:'Receive 5 stars now'},{key:'walls',name:'City walls',icon:'shield',desc:'Triple defense inside this city'}]:level===4?[{key:'borders',name:'Border growth',icon:'expand',desc:'Expand your territory by one ring'},{key:'population',name:'Population',icon:'city',desc:'+3 population for this city'}]:[{key:'giant',name:superDef.name,icon:superDef.icon,desc:superDef.hp+' health · Your tribe’s super unit'},{key:'park',name:'Park',icon:'tree',desc:'+250 bonus points'}];
 openModal(`<span class="eyebrow">YOUR CIVILIZATION IS GROWING</span><h2>${c.name} grows!</h2><p class="subtitle">Welcome to level ${level}. Choose your city reward.</p><div style="height:77px;width:77px;margin:20px auto 0">${cityPortrait(0)}</div><div class="reward-grid">${rewards.map(r=>`<button class="reward-card" data-reward="${r.key}">${icon(r.icon)}<strong>${r.name}</strong><small>${r.desc}</small></button>`).join('')}</div>`,'City upgrade');
 document.querySelectorAll('[data-reward]').forEach(el=>el.onclick=()=>{
  if(upgradeQueue[0]!==reward)return;const key=el.dataset.reward;upgradeQueue.shift();if(key==='workshop')c.workshop=(c.workshop||0)+1;if(key==='explorer')runExplorer(c.x,c.y);if(key==='resources')faction(0).stars+=5;if(key==='walls')c.walls=true;if(key==='borders'){c.radius=2;recomputeTerritory();reveal(c.x,c.y,2)}if(key==='population')addPopulation(c,3);if(key==='park')c.parks=(c.parks||0)+1;
  if(key==='giant')spawnRewardUnit(0,superUnit(0),c.x,c.y);
  updateProduction();updateConnections(0);updateTasks();sound('research');updateUI();save();showNextUpgrade();
 });
}
const TECH_POS={};
for(const [i,root]of ['hunting','organization','fishing','riding','climbing'].entries()){
 const angle=(-90+i*72)*Math.PI/180;TECH_POS[root]=[220+92*Math.cos(angle),229+92*Math.sin(angle)];
 Object.keys(TECHS).filter(k=>TECHS[k].parent===root).forEach((key,j)=>{const theta=angle+(j?1:-1)*16*Math.PI/180;TECH_POS[key]=[220+145*Math.cos(theta),229+145*Math.sin(theta)];for(const child of Object.keys(TECHS).filter(k=>TECHS[k].parent===key))TECH_POS[child]=[220+202*Math.cos(theta),229+202*Math.sin(theta)]});
}

function openTech(key=null){if(busy||isAnimating()||game.over){if(busy)toast('Wait for your turn.');return}clearBattlePreview();closeModal(true);techSelected=key||techSelected||'organization';$('tech-layer').classList.add('open');renderTech();sound();setTimeout(()=>$('close-tech').focus(),30)}
function closeTech(){$('tech-layer').classList.remove('open');requestRender();$('tech-button').focus({preventScroll:true});if(upgradeQueue.length)showNextUpgrade()}
function renderTech(){
 const tree=$('tech-tree'),baseKeys=Object.keys(TECHS).filter(k=>!TECHS[k].parent),hub=[220,229];let graph=`<circle cx="220" cy="238" r="101" fill="none" stroke="#64896f20" stroke-dasharray="2 8"/><circle cx="220" cy="238" r="175" fill="none" stroke="#64896f18" stroke-dasharray="2 8"/>`;
 for(const[key,d]of Object.entries(TECHS)){const p=TECH_POS[key],from=d.parent?TECH_POS[d.parent]:hub,learned=ownsTech(0,key);graph+=`<path d="M${from[0]} ${from[1]}L${p[0]} ${p[1]}" fill="none" stroke="${learned?'#529775':'#849d8966'}" stroke-width="2.2"/>`}
 graph+=`<circle cx="220" cy="229" r="30" fill="#2b718f" stroke="#c4dfca" stroke-width="1.5"/><svg x="195" y="202" width="50" height="50" viewBox="0 0 64 64">${portrait(faction(0).tribe).match(/<svg[^>]*>([\s\S]*)<\/svg>/)[1]}</svg><text x="220" y="274" text-anchor="middle" fill="#315c6a" font-size="11" font-weight="700">${tribeFor(0).name}</text>`;
 for(const key of Object.keys(TECHS)){const d=techInfo(key),[x,y]=TECH_POS[key],learned=ownsTech(0,key),available=canResearch(key),chosen=key===techSelected,labelY=d.tier===3&&y<240&&(x<85||x>355)?y-25:y+28;graph+=`<g class="tech-node" data-tech="${key}" tabindex="0" role="button" aria-label="${d.name}, ${learned?'researched':techCost(key)+' stars'}"><circle cx="${x}" cy="${y}" r="${d.tier===1?21:17}" fill="${learned?'#53996e':available?'#e0ecd9':'#d4dfd1'}" stroke="${chosen?'#d4993d':learned?'#306b59':available?'#819983':'#9cac9b'}" stroke-width="${chosen?3:1.7}"/><g color="${learned?'#fff':available?'#315f6a':'#8e9f94'}">${icon(d.icon).replace('<svg ',`<svg x="${x-10}" y="${y-10}" width="20" height="20" `)}</g><text x="${x}" y="${labelY}" text-anchor="${x<60?'start':x>380?'end':'middle'}" fill="${learned?'#2e6358':available?'#264f62':'#7d94a7'}" font-size="9" font-weight="700">${d.name}</text>${learned?`<circle cx="${x+15}" cy="${y-14}" r="6" fill="#fafbef"/><path d="m${x+12} ${y-14} 2 2 4-4" fill="none" stroke="#2195de" stroke-width="1.6"/>`:''}</g>`}
 tree.innerHTML=graph;tree.querySelectorAll('[data-tech]').forEach(el=>{el.onclick=()=>{techSelected=el.dataset.tech;renderTech();sound()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();techSelected=el.dataset.tech;renderTech()}}});
 $('tech-stars').innerHTML=faction(0).stars+icon('star');const d=techInfo(techSelected),learned=ownsTech(0,techSelected),available=canResearch(techSelected),cost=techCost(techSelected);$('tech-detail').innerHTML=`<div class="detail-top"><div class="detail-icon">${icon(d.icon)}</div><h3>${d.name}</h3>${learned?'<span class="learned" style="margin-left:auto">✓ Researched</span>':''}</div><p>${d.desc}</p>${learned?'<div class="learned">Your tribe has mastered this technology.</div>':`<button class="large-button" id="research-tech" ${!available||faction(0).stars<cost?'disabled':''}>${!available?'Requires '+techInfo(d.parent).name:faction(0).stars<cost?'Need '+(cost-faction(0).stars)+' more stars':'Research'} <span style="display:flex;gap:4px;align-items:center">${cost}${icon('star')}</span></button>`}`;
 if($('research-tech'))$('research-tech').onclick=()=>{if(ownsTech(0,techSelected)||!available||faction(0).stars<cost)return;faction(0).stars-=cost;faction(0).tech.push(techSelected);updateTasks();sound('research');save();updateUI();renderTech()};
}

function showResult(){
 if(!game.over)return;const win=game.winner===0,perfection=game.mode==='perfection',rating=dominationRating(),award=rating.total>=95?3:rating.total>=70?2:rating.total>=20?1:0;
 const heading=!win?'Defeat':perfection?score().toLocaleString()+' points':rating.total.toFixed(1)+'%',label=!win?'YOUR LAST CITY WAS LOST':perfection?'BASE SCORE':'DOMINATION RATING';
 openModal(`<div class="game-result"><div class="outcome-icon">${icon(win?'trophy':'shield')}</div><span class="eyebrow">${label}</span><h2>${heading}</h2><p class="subtitle">${perfection?'Your civilization after '+game.turn+' turns.':win?'Victory · '+('★'.repeat(award)||'No stars')+(rating.total===100?' · Perfect conquest':''):'Your tribe has fallen.'}</p>${perfection?scoreRows():ratingRows()}<div class="result-grid"><div><b>${game.turn}</b><small>TURNS PLAYED</small></div><div><b>${game.kills}</b><small>ENEMIES DEFEATED</small></div><div><b>${game.losses||0}</b><small>UNITS LOST</small></div></div>${perfection?'<p class="save-label">Base points only. Difficulty bonuses are not applied.</p>':''}<button class="large-button" id="result-new">${icon('new')}Play again</button><button class="large-button secondary" id="result-view">${icon('eye')}Explore the world</button></div>`,'Game result');$('result-new').onclick=openNewGame;$('result-view').onclick=()=>closeModal(true);sound(win?'victory':'turn');updateUI();
}
function openStats(){
 openModal(modalCloseButton()+'<span class="eyebrow">'+game.mode.toUpperCase()+' · TURN '+game.turn+'</span><h2>Game Stats</h2><p class="subtitle">'+tribeFor(0).name+' · '+(MAP_TYPES[game.mapType]?.name||'Legacy map')+' · '+game.size*game.size+' tiles<br>'+playerCities().length+' cities · '+income(0)+' stars per turn</p>'+scoreRows()+(game.mode==='domination'?'<span class="eyebrow">CONQUEST RATING · '+dominationRating().total.toFixed(1)+'%</span>'+ratingRows():'')+'<button class="menu-item" id="stats-monuments">'+icon('trophy')+'<span>Monuments</span><small>'+faction(0).tasks.unlocked.length+'/7 unlocked</small></button><button class="menu-item" id="stats-diplomacy">'+icon('flag')+'<span>Diplomacy</span>'+icon('chevron')+'</button><div class="stats-list">'+game.factions.map(f=>'<div class="stats-row"><div class="portrait">'+tribePortrait(f.tribe,f.id)+'</div><strong>'+factionName(f.id)+'</strong><small>'+(f.eliminated?'Defeated':game.cities.filter(c=>c.owner===f.id).length+' cities<br>'+game.units.filter(u=>u.owner===f.id).length+' units')+'</small></div>').join('')+'</div><button class="large-button" id="stats-done">Back to game</button>','Game statistics');$('stats-done').onclick=()=>closeModal();$('stats-monuments').onclick=()=>openMonuments();$('stats-diplomacy').onclick=openDiplomacy;
}
$('stats-button').onclick=openStats;$('menu-button').onclick=openMenu;$('tech-button').onclick=()=>openTech();$('end-turn').onclick=endTurn;$('close-tech').onclick=closeTech;$('next-unit').onclick=nextUnit;
$('center-map').onclick=()=>{const c=playerCities().find(c=>c.capital)||playerCities()[0];if(c){focusOn(c.x,c.y,true);sound()}};$('zoom-in').onclick=()=>zoomMap(1.2);$('zoom-out').onclick=()=>zoomMap(1/1.2);$('dismiss-tutorial').onclick=()=>{prefs.hint=false;$('tutorial').style.display='none';save()};
$('modal-layer').addEventListener('click',e=>{if(e.target===$('modal-layer')&&!upgradeQueue.length)closeModal()});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'){const open=$('tech-layer').classList.contains('open')?$('tech-layer'):$('modal-layer').classList.contains('open')?$('modal'):null;if(open){const elements=[...open.querySelectorAll('button:not(:disabled),select,[tabindex="0"]')],first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}return}
 if(e.key==='Escape'){if($('tech-layer').classList.contains('open'))closeTech();else if($('modal-layer').classList.contains('open'))closeModal();else{selected=null;updateSelection()}return}
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$('modal-layer').classList.contains('open')||$('tech-layer').classList.contains('open'))return;
 if(e.key.toLowerCase()==='t')openTech();if(e.key.toLowerCase()==='e'){e.preventDefault();endTurn()}if(e.key.toLowerCase()==='c')$('center-map').click();if(e.key==='+'||e.key==='=')zoomMap(1.15);if(e.key==='-')zoomMap(1/1.15);if(e.key.startsWith('Arrow'))cameraMotion=panMotion=null;if(e.key==='ArrowLeft'){e.preventDefault();view.x+=35}if(e.key==='ArrowRight'){e.preventDefault();view.x-=35}if(e.key==='ArrowUp'){e.preventDefault();view.y+=35}if(e.key==='ArrowDown'){e.preventDefault();view.y-=35}requestRender();saveViewSoon();
});
new ResizeObserver(()=>{resize();render()}).observe($('stage'));resize();
function refreshResolution(){resize();requestRender()}
window.addEventListener('resize',refreshResolution);window.visualViewport?.addEventListener('resize',refreshResolution);
function watchResolution(){const query=matchMedia('(resolution: '+(window.devicePixelRatio||1)+'dppx)');query.addEventListener('change',()=>{refreshResolution();watchResolution()},{once:true})}watchResolution();
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearBattlePreview();panMotion=cameraMotion=null;save();cancelAnimationFrame(frameId);frameId=0;clearTimeout(idleFrameTimer);pointerState.clear();gesture=null;canvas.classList.remove('dragging')}else{requestRender();if(game.turnState&&!busy&&!game.over)resumeTurn()}});
window.addEventListener('pagehide',save);
if(load()){updateUI();if(game.over)setTimeout(showResult,150);else if(game.turnState)resumeTurn();else if(upgradeQueue.length)setTimeout(showNextUpgrade,100)}else newGame({seed:578201});
if(saveNotice)setTimeout(()=>toast(saveNotice),180);
requestRender();
</script>
