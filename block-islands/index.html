<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#182d42">
  <title>Block Islands</title>
  <link rel="stylesheet" href="./game.css">
<meta data-games-pwa-runtime name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
</head>
<body>
  <main id="app" aria-label="Block Islands voxel island adventure">
    <canvas tabindex="0" id="world" aria-label="Voxel island. Look with the right side of the screen, move with the left joystick, then hold Mine or tap Place."></canvas>
    <header class="top-hud hud">
      <button id="menuButton" class="round" aria-label="Open pause and save menu">☰</button>
      <div class="island-readout"><span id="stageNumber">ISLAND 1 / 12</span><strong id="stageName">Mosslight Camp</strong></div>
      <div class="vitals" aria-label="Health"><span>♥</span><b id="healthText">8</b><small id="dayClock">DAY</small></div>
    </header>
    <button id="objectiveButton" class="objective hud" aria-expanded="false"><b>OBJECTIVE</b><span id="questProgress">Mine wood + stone; craft campfire.</span></button>
    <div id="statusLine" class="status hud" role="status">Aim at a trunk or pale rock.</div>
    <button id="mouseButton" type="button" class="mouse-look hud">Mouse look</button>
    <div id="crosshair" class="crosshair hud" aria-hidden="true"><i></i><i></i></div>
    <div id="targetTag" class="target-tag hud" hidden></div>
    <div id="mineProgress" class="mine-progress hud" aria-hidden="true"><i></i></div>
    <aside id="heldReadout" class="held-readout hud" aria-live="polite">Plank · 0</aside>
    <section id="hotbar" class="hotbar hud" role="group" aria-label="Hotbar"></section>
    <section class="touch-layer hud" aria-label="Touch game controls">
      <div id="moveZone" class="move-zone" aria-label="Move with this joystick"><span id="joyBase"></span><span id="joyKnob"></span></div>
      <div id="lookZone" class="look-zone" aria-label="Drag to look around"></div>
      <div class="action-cluster" aria-label="Actions">
        <button id="cameraButton" class="round action-button camera" aria-label="Switch to first-person view">◉</button>
        <button id="jumpButton" class="round action-button jump" aria-label="Jump">↑</button>
        <button id="mineButton" class="action-button mine" aria-label="Hold to mine">Mine</button>
        <button id="placeButton" class="action-button place" aria-label="Place selected block">Place</button>
        <button id="strikeButton" class="round action-button strike" aria-label="Strike creature">Strike</button>
        <button id="craftButton" class="round action-button craft" aria-label="Open crafting">Craft</button>
      </div>
    </section>
    <div id="overlay" class="overlay open" role="dialog" aria-modal="true" aria-labelledby="overlayTitle"><section id="panel" class="panel"></section></div>
    <input id="importInput" type="file" accept="application/json,.json" hidden>
  </main>
  <script src="./rules.js"></script>
  <script src="./voxel-view.js"></script>
  <script src="./body-physics.js"></script>
  <script src="./game.js"></script>
<script data-games-pwa-runtime src="./game-pwa.js"></script>
</body>
</html>
